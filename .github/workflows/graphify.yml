name: Graphify

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "githooks/**"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday refresh as a safety net

permissions:
  contents: write

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GRAPHIFY_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install graphify
        run: pip install "graphifyy[gemini]"

      - name: Restore graphify state
        uses: actions/cache@v4
        with:
          path: graphify-out
          key: graphify-${{ github.event.repository.name }}-${{ github.sha }}
          restore-keys: graphify-${{ github.event.repository.name }}-

      - name: Build knowledge graph
        run: python scripts/graphify_pipeline.py

      - name: Export interactive HTML
        run: graphify export html

      - name: Move outputs into repo
        run: |
          mkdir -p docs/graphify
          cp graphify-out/graph.html docs/graphify/graph.html
          cp graphify-out/GRAPH_REPORT.md docs/graphify/GRAPH_REPORT.md
          cp graphify-out/graph.json docs/graphify/graph.json

      - name: Commit graph artifacts
        run: |
          git config user.name "gitnexus-bot"
          git config user.email "gitnexus-bot@users.noreply.github.com"
          git add docs/graphify
          if git diff --cached --quiet; then
            echo "No graph artifacts changes to commit"
            exit 0
          fi
          git commit -m "chore(graphify): refresh knowledge graph artifacts [skip ci]"
          attempts=0
          until git push; do
            attempts=$((attempts+1))
            if [ "$attempts" -ge 3 ]; then exit 1; fi
            git stash -u > /dev/null 2>&1 || true
            git pull --rebase origin main || true
            git stash pop > /dev/null 2>&1 || true
            sleep 5
          done
