name: iOS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The committed project.pbxproj is the source of truth and already
      # includes the manual llama.cpp / OnDeviceKit linking fixes. Do NOT run
      # `xcodegen generate` here — it would overwrite those fixes and break
      # the build.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      # Runs the Selfward unit tests on a concrete simulator. Requires an Xcode
      # that supports the iOS 26 availability checks used in the app (Xcode 26+).
      # If the runner's default Xcode is older, pin it, e.g.:
      #   - uses: maxim-lobanov/setup-xcode@v1
      #     with: { xcode-version: '26.0' }
      - name: Run unit tests
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -Eo 'iOS [0-9.]+' | sort -V | tail -1 | sed 's/iOS //')
          DEVICE=$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9]+ Pro' | head -1)
          echo "Using simulator: $DEVICE ($RUNTIME)"
          xcodebuild test \
            -project ios/Selfward.xcodeproj \
            -scheme Selfward \
            -destination "platform=iOS Simulator,name=$DEVICE,OS=$RUNTIME" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-"
