name: Selfward
options:
  bundleIdPrefix: com.intelligentdesignsllc.selfward
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  LLM:
    url: https://github.com/eastriverlee/LLM.swift
    exactVersion: "1.8.0"
  OnDeviceKit:
    url: https://github.com/AnubisRooster/OnDeviceKit
    from: "0.1.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Selfward:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: Selfward/Resources/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Selfward uses the microphone for hands-free voice conversations, so you can speak with the therapist and hear spoken replies."
        NSSpeechRecognitionUsageDescription: "Selfward transcribes your speech (on-device when supported) so you can talk through your thoughts instead of typing."
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: Selfward
        excludes:
          - "Resources/AppIcon.png"
    resources:
      - path: Selfward/Resources/Graph
        buildPhase: resources
    dependencies:
      - package: LLM
      - package: OnDeviceKit
        product: VoiceLoopKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intelligentdesignsllc.selfward.app
        INFOPLIST_FILE: Selfward/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  SelfwardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SelfwardTests
    dependencies:
      - target: Selfward
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intelligentdesignsllc.selfward.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Selfward.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Selfward"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Selfward:
    build:
      targets:
        Selfward: all
        SelfwardTests: [test]
    test:
      targets:
        - SelfwardTests
      gatherCoverageData: true
