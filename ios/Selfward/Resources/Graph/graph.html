<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Knowledge Graph</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; }
    #cy {
      width: 100%;
      height: 100%;
      display: block;
    }
    #info {
      position: absolute;
      top: 96px;
      left: 10px;
      right: 10px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 10px;
      display: none;
      max-width: 320px;
      word-break: break-word;
    }
    #empty {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 15px;
      color: #888;
      text-align: center;
      display: none;
    }
    #legend {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      background: rgba(0,0,0,0.5);
      border-radius: 10px;
      padding: 7px 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 12px;
      color: #eee;
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>
  <div id="cy"></div>
  <div id="info"></div>
  <div id="empty">No map yet.<br>Keep talking — your patterns and the links between them will appear here.</div>
  <div id="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#888888"></span>You</span>
    <span class="legend-item"><span class="legend-dot" style="background:#D0021B"></span>Emotion</span>
    <span class="legend-item"><span class="legend-dot" style="background:#4A90D9"></span>Person</span>
    <span class="legend-item"><span class="legend-dot" style="background:#7ED321"></span>Belief</span>
    <span class="legend-item"><span class="legend-dot" style="background:#9B59B6"></span>Theme</span>
    <span class="legend-item"><span class="legend-dot" style="background:#F5A623"></span>Event</span>
  </div>
  <script src="cytoscape.min.js"></script>
  <script>
    var cy = null;

    var typeColors = {
      "person":  "#4A90D9",
      "event":   "#F5A623",
      "emotion": "#D0021B",
      "belief":  "#7ED321",
      "theme":   "#9B59B6",
      "you":     "#888888",
      "default": "#999999"
    };

    // The synthetic center node's id -- not a real pattern, never sent to
    // the native nodeTap handler.
    var YOU_ID = "__you__";

    // Plain-language phrasing for relationship types, mirroring
    // GraphService.getEdgeTypeLabel on the Swift side.
    var edgeLabels = {
      "CAUSES":           "leads to",
      "TRIGGERS":         "brings up",
      "SUPPRESSES":       "pushes down",
      "COMPENSATES_FOR":  "covers for",
      "ASSOCIATED_WITH":  "goes with"
    };

    function labelForEdge(type) {
      if (edgeLabels[type]) { return edgeLabels[type]; }
      return (type || "").replace(/_/g, " ").toLowerCase();
    }

    function colorFor(type) {
      return typeColors[type] || typeColors["default"];
    }

    window.renderGraph = function(jsonStr) {
      var data;
      try { data = JSON.parse(jsonStr); } catch(e) { return; }

      var nodes = (data.elements && data.elements.nodes) ? data.elements.nodes : [];
      var edges = (data.elements && data.elements.edges) ? data.elements.edges : [];

      var emptyEl = document.getElementById("empty");
      if (nodes.length === 0) {
        emptyEl.style.display = "block";
        return;
      }
      emptyEl.style.display = "none";

      var cyNodes = nodes.map(function(n) {
        var d = n.data;
        return {
          data: {
            id: d.id,
            label: d.label,
            type: d.type,
            strength: d.strength || 1,
            sessions: d.sessions || 1
          }
        };
      });

      var cyEdges = edges.map(function(e) {
        var d = e.data;
        return {
          data: {
            id: d.id,
            source: d.source,
            target: d.target,
            type: d.type,
            weight: d.weight || 1
          }
        };
      });

      // Rank nodes by how central they are (own strength plus total edge
      // weight touching them), then anchor the top few to a synthetic "you"
      // node placed at the center -- gives a novice an intuitive "this
      // radiates from me" reading instead of an arbitrary physics-simulated
      // blob. Purely a rendering device: "you" and its spokes are never
      // sent to the native layer and carry no real data.
      var nodeScore = {};
      cyEdges.forEach(function(e) {
        nodeScore[e.data.source] = (nodeScore[e.data.source] || 0) + e.data.weight;
        nodeScore[e.data.target] = (nodeScore[e.data.target] || 0) + e.data.weight;
      });
      cyNodes.forEach(function(n) {
        nodeScore[n.data.id] = (nodeScore[n.data.id] || 0) + n.data.strength;
      });
      var ranked = cyNodes.slice().sort(function(a, b) {
        return (nodeScore[b.data.id] || 0) - (nodeScore[a.data.id] || 0);
      });
      var anchorTargets = ranked.slice(0, Math.min(6, ranked.length));

      cyNodes.push({
        data: { id: YOU_ID, label: "You", type: "you", strength: 0, sessions: 0 }
      });
      anchorTargets.forEach(function(n) {
        cyEdges.push({
          data: { id: "you-" + n.data.id, source: YOU_ID, target: n.data.id, type: "ANCHOR", weight: 1 }
        });
      });

      // Bucket nodeScore into a small number of discrete tiers rather than
      // using the raw (near-unique) score directly. Concentric gives every
      // distinct value its own ring -- with continuous scores that puts one
      // node per ring, which collapses the whole "radial" layout onto a
      // single line instead of actually fanning nodes out around each ring.
      var maxScore = 0;
      cyNodes.forEach(function(n) {
        if (n.data.id !== YOU_ID) { maxScore = Math.max(maxScore, nodeScore[n.data.id] || 0); }
      });
      function tierFor(id) {
        if (id === YOU_ID) { return 3; }
        if (maxScore <= 0) { return 0; }
        var ratio = (nodeScore[id] || 0) / maxScore;
        if (ratio > 0.66) { return 2; }
        if (ratio > 0.33) { return 1; }
        return 0;
      }

      if (cy) { cy.destroy(); }

      cy = cytoscape({
        container: document.getElementById("cy"),
        elements: { nodes: cyNodes, edges: cyEdges },
        style: [
          {
            selector: "node",
            style: {
              "label": "data(label)",
              "background-color": function(ele) { return colorFor(ele.data("type")); },
              "width": function(ele) { return Math.max(30, Math.min(60, ele.data("strength") * 14)); },
              "height": function(ele) { return Math.max(30, Math.min(60, ele.data("strength") * 14)); },
              "font-size": "11px",
              "text-valign": "bottom",
              "text-halign": "center",
              "text-margin-y": 4,
              "color": "#ffffff",
              "text-background-color": "#000000",
              "text-background-opacity": 0.5,
              "text-background-padding": "2px",
              "text-background-shape": "roundrectangle",
              "border-width": 0
            }
          },
          {
            selector: "node:selected",
            style: {
              "border-width": 3,
              "border-color": "#ffffff",
              "overlay-opacity": 0.15
            }
          },
          {
            // The synthetic center anchor: fixed size, never grows/shrinks
            // with strength, and not selectable (it isn't a real pattern).
            selector: 'node[type = "you"]',
            style: {
              "width": 46,
              "height": 46,
              "font-weight": "bold",
              "text-background-opacity": 0.7
            }
          },
          {
            selector: "edge",
            style: {
              "line-color": "#555",
              "target-arrow-color": "#555",
              "target-arrow-shape": "triangle",
              "curve-style": "bezier",
              "width": function(ele) { return Math.max(1, ele.data("weight") * 1.5); },
              "opacity": 0.6,
              "font-size": "9px",
              "label": function(ele) { return labelForEdge(ele.data("type")); },
              "color": "#aaa",
              "text-rotation": "autorotate",
              "text-background-color": "#000",
              "text-background-opacity": 0.4,
              "text-background-padding": "1px"
            }
          },
          {
            // Spokes from the "you" anchor to its top patterns: thin,
            // dashed, unlabeled -- visually distinct from real relationships
            // between two patterns, which stay solid, colored, and labeled.
            selector: 'edge[type = "ANCHOR"]',
            style: {
              "target-arrow-shape": "none",
              "line-style": "dashed",
              "width": 1,
              "opacity": 0.35,
              "label": ""
            }
          },
          {
            selector: "edge:selected",
            style: { "opacity": 1, "line-color": "#ffffff", "target-arrow-color": "#ffffff" }
          }
        ],
        layout: {
          // Ranks nodes by nodeScore (computed above) into concentric
          // rings, so the strongest, most-connected patterns settle near
          // the "you" anchor at the center and weaker ones fall toward the
          // edge -- a stable, readable arrangement instead of "cose"'s
          // physics simulation, which resettles differently on every open
          // and gives a novice no way to tell what's actually significant.
          name: "concentric",
          animate: false,
          minNodeSpacing: 40,
          concentric: function(node) { return tierFor(node.data("id")); },
          levelWidth: function() { return 1; }
        },
        userZoomingEnabled: true,
        userPanningEnabled: true,
        minZoom: 0.2,
        maxZoom: 5
      });

      var infoEl = document.getElementById("info");

      cy.on("tap", "node", function(evt) {
        var d = evt.target.data();
        if (d.id === YOU_ID) { return; }
        infoEl.style.display = "none";
        // Hand off to the native layer, which presents a full list of the
        // patterns connected to this one in a table.
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nodeTap) {
          window.webkit.messageHandlers.nodeTap.postMessage(d.id);
        }
      });

      cy.on("tap", "edge", function(evt) {
        var edge = evt.target;
        var d = edge.data();
        if (d.type === "ANCHOR") { return; }
        var srcLabel = cy.getElementById(d.source).data("label") || d.source;
        var tgtLabel = cy.getElementById(d.target).data("label") || d.target;
        var times = Math.max(1, Math.round(parseFloat(d.weight)));
        infoEl.textContent =
          srcLabel + " " + labelForEdge(d.type) + " " + tgtLabel +
          " · seen together " + times + (times === 1 ? " time" : " times");
        infoEl.style.display = "block";
      });

      cy.on("tap", function(evt) {
        if (evt.target === cy) { infoEl.style.display = "none"; }
      });

      // Fit the graph with a small padding.
      cy.fit(undefined, 24);
    };
  </script>
</body>
</html>
